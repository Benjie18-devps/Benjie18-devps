# Builds the "GitHub stats" image in the profile README and commits it as metrics.svg.
# It runs with a personal access token (METRICS_TOKEN secret), so commits and
# languages from private repos are counted without exposing the repos themselves.
name: Metrics

on:
  schedule:
    - cron: '0 11 * * *'   # every day, 06:00 Panama time
  push:
    branches: [main]
    paths: ['.github/workflows/metrics.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    name: Generate metrics.svg
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Benjie18-devps
          filename: metrics.svg
          committer_message: 'chore: update metrics'
          template: classic
          config_timezone: America/Panama
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member

          # Most used languages, including private repos the token can read
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, markdown

          # Contribution calendar for the past year, with streaks
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
